<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra Animated Road Scene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top, #87ceeb 70%, #fff 100%);
      overflow: hidden;
      height: 100vh;
    }
    /* Sun */
    .sun {
      position: absolute;
      top: 40px;
      left: 80px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 60% 40%, #ffe066 70%, #ffd700 100%);
      border-radius: 50%;
      box-shadow: 0 0 60px 20px #ffe066;
      z-index: 0;
    }
    /* Mountains */
    .mountain {
      position: absolute;
      bottom: 180px;
      left: 0;
      width: 100vw;
      height: 180px;
      z-index: 1;
      pointer-events: none;
    }
    .mountain svg {
      width: 100vw;
      height: 180px;
      display: block;
    }
    /* Road */
    .road {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 180px;
      background: #444;
      box-shadow: 0 0 40px #222 inset;
      z-index: 2;
    }
    .lane {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100vw;
      height: 8px;
      background: repeating-linear-gradient(
        to right,
        #fff 0 40px,
        transparent 40px 80px
      );
      opacity: 0.6;
      transform: translateY(-50%);
      z-index: 3;
    }
    /* Vehicles */
    .car, .bus, .truck {
      position: absolute;
      bottom: 60px;
      border-radius: 10px 10px 8px 8px;
      z-index: 10;
    }
    .car {
      left: -100px;
      width: 90px;
      height: 40px;
      background: #ff5252;
      box-shadow: 0 2px 8px #222;
      animation: moveCar 8s linear infinite;
      animation-delay: 0s;
    }
    .bus {
      left: -250px;
      width: 140px;
      height: 48px;
      background: #ffd700;
      border-radius: 12px 12px 10px 10px;
      animation: moveBus 12s linear infinite;
      animation-delay: 2s;
    }
    .truck {
      left: -400px;
      width: 120px;
      height: 44px;
      background: #4f8a8b;
      border-radius: 10px 10px 8px 8px;
      animation: moveTruck 10s linear infinite;
      animation-delay: 4s;
    }
    .car .window, .bus .window, .truck .window {
      position: absolute;
      top: 8px;
      left: 12px;
      width: 60px;
      height: 18px;
      background: #e0f7fa;
      border-radius: 4px;
    }
    .bus .window {
      width: 100px;
      left: 18px;
    }
    .truck .window {
      width: 40px;
      left: 10px;
      top: 10px;
      height: 16px;
    }
    .car .wheel, .bus .wheel, .truck .wheel {
      position: absolute;
      bottom: -10px;
      width: 18px;
      height: 18px;
      background: #222;
      border-radius: 50%;
      box-shadow: 0 0 2px #000;
    }
    .car .wheel.left { left: 14px; }
    .car .wheel.right { right: 14px; }
    .bus .wheel.left { left: 22px; }
    .bus .wheel.right { right: 22px; }
    .truck .wheel.left { left: 18px; }
    .truck .wheel.right { right: 18px; }
    /* Clouds */
    .cloud {
      position: absolute;
      top: 40px;
      left: -120px;
      width: 100px;
      height: 40px;
      background: #fff;
      border-radius: 50px;
      opacity: 0.8;
      animation: moveCloud 18s linear infinite;
    }
    .cloud:before, .cloud:after {
      content: '';
      position: absolute;
      background: #fff;
      border-radius: 50px;
    }
    .cloud:before {
      width: 60px;
      height: 60px;
      left: 20px;
      top: -20px;
    }
    .cloud:after {
      width: 40px;
      height: 40px;
      left: 60px;
      top: 10px;
    }
    .cloud2 {
      top: 90px;
      left: -200px;
      width: 140px;
      height: 50px;
      animation: moveCloud 22s linear infinite;
      animation-delay: 6s;
    }
    .cloud3 {
      top: 60px;
      left: -300px;
      width: 80px;
      height: 32px;
      animation: moveCloud 15s linear infinite;
      animation-delay: 12s;
    }
    /* Birds */
    .bird {
      position: absolute;
      top: 70px;
      left: -60px; Varun M B, [Aug 11, 2025 at 9:21 AM]
width: 40px;
      height: 20px;
      z-index: 5;
      animation: moveBird 10s linear infinite;
    }
    .bird .wing {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border-bottom: 4px solid #222;
      border-left: 4px solid #222;
      background: transparent;
      top: 0;
      left: 0;
      transform: rotate(-30deg);
      animation: flap 0.7s infinite alternate;
    }
    .bird .wing.right {
      left: 20px;
      transform: scaleX(-1) rotate(-30deg);
    }
    .bird .body {
      position: absolute;
      left: 14px;
      top: 8px;
      width: 12px;
      height: 8px;
      background: #222;
      border-radius: 50%;
    }
    .bird2 {
      top: 120px;
      left: -100px;
      animation: moveBird 13s linear infinite;
      animation-delay: 4s;
    }
    .bird3 {
      top: 40px;
      left: -180px;
      animation: moveBird 17s linear infinite;
      animation-delay: 8s;
    }
    .bird4 {
      top: 100px;
      left: -220px;
      animation: moveBird 20s linear infinite;
      animation-delay: 10s;
    }
    @keyframes flap {
      0% { transform: rotate(-30deg); }
      100% { transform: rotate(10deg); }
    }
    /* Trees */
    .tree {
      position: absolute;
      bottom: 180px;
      left: 60px;
      width: 30px;
      height: 90px;
      z-index: 1;
    }
    .tree .trunk {
      position: absolute;
      bottom: 0;
      left: 12px;
      width: 6px;
      height: 40px;
      background: #8d5524;
      border-radius: 3px;
    }
    .tree .leaves {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle at 50% 60%, #228B22 70%, #006400 100%);
      border-radius: 50%;
      box-shadow: 0 0 12px #228B22;
    }
    .tree2 { left: 180px; }
    .tree3 { left: 320px; }
    .tree4 { left: 500px; }
    .tree5 { left: 700px; }
    .tree6 { left: 900px; }
    .tree7 { left: 1100px; }
    /* Animations */
    @keyframes moveCar {
      0% { left: -100px; }
      100% { left: 110vw; }
    }
    @keyframes moveBus {
      0% { left: -250px; }
      100% { left: 110vw; }
    }
    @keyframes moveTruck {
      0% { left: -400px; }
      100% { left: 110vw; }
    }
    @keyframes moveCloud {
      0% { left: -120px; }
      100% { left: 110vw; }
    }
    @keyframes moveBird {
      0% { left: -60px; }
      100% { left: 110vw; }
    }
  </style>
</head>
<body>
  <!-- Sun -->
  <div class="sun"></div>
  <!-- Mountains -->
  <div class="mountain">
    <svg viewBox="0 0 1200 180" preserveAspectRatio="none">
      <polygon points="0,180 200,80 400,180" fill="#b0c4de"/>
      <polygon points="300,180 500,60 700,180" fill="#a2b9bc"/>
      <polygon points="600,180 900,40 1200,180" fill="#b0c4de"/>
      <polygon points="800,180 1000,100 1200,180" fill="#a2b9bc"/>
    </svg>
  </div>
  <!-- Clouds -->
  <div class="cloud"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <!-- Birds -->
  <div class="bird">
    <div class="wing"></div>

  </div>
  <div class="bird bird2">

  </div>
  <div class="bird bird3">

    <div class="body"></div>
  </div>
  <div class="bird bird4">
    <div class="wing"></div>
    <div class="wing right"></div>
    <div class="body"></div>
  </div>
  <!-- Trees -->
  <div class="tree">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <div class="tree tree2">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <div class="tree tree3">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <div class="tree tree4">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <div class="tree tree5">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <div class="tree tree6">
    <div class="trunk"></div> Varun M B, [Aug 11, 2025 at 9:21 AM]
<div class="leaves"></div>
  </div>
  <div class="tree tree7">
    <div class="trunk"></div>
    <div class="leaves"></div>
  </div>
  <!-- Road and Lane -->
  <div class="road">
    <div class="lane"></div>
  </div>
  <!-- Vehicles -->
  <div class="car">
    <div class="window"></div>
    <div class="wheel left"></div>
    <div class="wheel right"></div>
  </div>
  <div class="bus">
    <div class="window"></div>
    <div class="wheel left"></div>

  </div>
  <div class="truck">
    <div class="window"></div>

</body>
</html>
