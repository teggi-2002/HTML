<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
        }

        hr {
            height: 10px;
            width: 50%;
            background-color: black;
        }

        #linear-gradient {
            width: 500px;
            height: 500px;
            border: 5px solid black;
            background-image: linear-gradient(to bottom left, red, yellow, green, blue, indigo, violet);
            background-image: center;
        }

        /* #rlinear-gradient {
            width: 500px;
            height: 500px; 
            border:5px solid black;
            background-image: repeating-linear-gradient(to top right, red, yellow, green, blue, indigo, violet);
        } */
        #rlinear-gradient{
            height: 500px;
            width: 500px;
            border: 5px solid black;
            background-image: repeating-linear-gradient(to top left, olive 0%, olive 5%, aqua 5%, aqua 10%);
            border: 5px solid black;
        }

        #flag {
            height: 400px;
            width: 500px;
            background-color: blue;
            background-image: linear-gradient(orange 0%, orange 33.1%, white 33.3%, white 66.6%, green 66.7%, green 100%);
        }
    </style>
</head>

<body>
    <h1>Gradient in CSS</h1>
    <hr>

    <div id="linear-gradient">

    </div>
    <hr>
    <div id="rlinear-gradient"></div>
    <hr>
    <div id="flag">

    </div>
</body>

</html>
