<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #chotta{
            height: 700px;
            width: 80%;
            background-color: lightblue;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position:relative;
        }
        #chutki{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        #raju{
            height: 100px;
            width: 100px;
            background-color: green;
            border:3px solid black;
            position: absolute;
        }
        #jaggu{
            height: 100px;
            width: 100px;
            background-color: yellow;
            background-color: hotpink;
            border:3px solid black;
            position: relative;
        }
        #kalia{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
        }
        #dolu{
            height: 100px;
            width: 100px;
            background-color: orange;
        }
        #bolu{
            height: 100px;
            width: 100px;
            background-color: pink;
        }
        #tun-tun{
            height: 100px;
            width: 100px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <!-- div#chota>div#chutki+div#raju+div#jaggu+div#kalia+div#dolu+div#bolu+div#tun-tun -->
    <div id="chotta">
        <div id="chutki"></div>
        <div id="raju"></div>
        <div id="jaggu"></div>
        <div id="kalia"></div>
        <div id="dolu"></div>
        <div id="bolu"></div>
        <div id="tun-tun"></div>
    </div>
</body>
</html>
