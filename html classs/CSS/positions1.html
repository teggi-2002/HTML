<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #positions{
            height: 800px;
            width: 90%;
            background-color: lightblue;
            display:flex;
            justify-content:space-around;
        }
        #relative{
            height: 300px;
            width: 300px;
            background-color: lightgreen;
            display:flex;
            justify-content:center;
            align-items:center;
            position: relative;
            right: 100px;
            bottom:100px;
        }
        #absolute{
            height: 300px;
            width: 300px;
            background-color: lightcoral;
            display:flex;
            justify-content:center;
            align-items:center;
            position: absolute;
            right: 100px;
            bottom:100px;
        }
        
    </style>
</head>
<body>
    <!-- div#positons>div#relative{relative}+div#absolute{absolute} -->
    <div id="positions">
        <div id="relative">relative</div>
        <div id="absolute">absolute</div>
    </div>
</body>
</html>
