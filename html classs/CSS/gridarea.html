<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grid-container{
            height: 80vh;
            width: 80vw;
            background-color:darkblue;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            /* column-gap:5px;
            row-gap: 5px; */
            gap: 5px 5px;
        }

        body{
            background-color:darkgreen;
        }
        #flex-container{
            height: 100vh;
            width: 100vw;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .items{
            background-color:aquamarine;

        }

        #grid-container{
            height: 80vh;
            width: 80vw;
            background-color:black;
            display: grid;
            grid-template-areas: "hdr hdr hdr"
                                  "sct1 sct2 sct3"
                                  "art1 art1 art2"
                                  "ftr ftr ftr" ;
        }
        #grid-items1{
            grid-area:hdr ;
        }
        #grid-items2{
            grid-area:sct1;
        }
        #grid-items3{
            grid-area:sct2;
        }
        #grid-items4{
            grid-area:sct3;
        }
        #grid-items5{
            grid-area:art1;
        }
        #grid-items6{
            grid-area:art2;
        }
        #grid-items7{
            grid-area:ftr;
        }
    </style>
</head>
<body>
   <div id="flex-container">
        <div id="grid-container">
            <div id="grid-items1" class="items">grid-boxes</div>
            <div id="grid-items2" class="items">grid-boxes</div>
            <div id="grid-items3" class="items">grid-boxes</div>
            <div id="grid-items4" class="items">grid-boxes</div>
            <div id="grid-items5" class="items">grid-boxes</div>
            <div id="grid-items6" class="items">grid-boxes</div>
            <div id="grid-items7" class="items">grid-boxes</div>
        </div>
    </div> 
</body>
</html>
