<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #hexa{
            height: 100px;
            width: 500px;
            background-color: #123ABC;
        }
        #rgb{
            height: 100px;
            width: 500px;
            background-color: rgb(0,0,0);
        }
        #rgba{
            height: 100px;
            width: 500px;
            background-color: rgba(0,0,255,0.5);
        }
        #hsl{
            height: 100px;
            width: 500px;
            background-color: hsl(300, 100%, 30%);
        }
        #hsla{
            height: 100px;
            width: 500px;
            background-color: hsla(300, 100%, 30%, 0.5);
        }
    </style>
</head>
<body>
    <div id="hexa"></div>
    <div id="rgb"></div>
    <div id="rgba"></div>
    <div id="hsl"></div>
    <div id="hsla"></div>
</body>
</html>
